qlib_init:
    provider_uri: "us_pipeline/data/qlib_bin"
    region: us
market: &market sp500
benchmark: &benchmark SPY
data_handler_config: &data_handler_config
    start_time: 2021-06-01
    end_time: 2026-04-24
    fit_start_time: 2021-06-01
    fit_end_time: 2024-06-30
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 30
            n_drop: 5
    backtest:
        start_time: 2025-04-01
        end_time: 2026-04-22
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 1
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8
            learning_rate: 0.02
            subsample: 0.8
            lambda_l1: 50.0
            lambda_l2: 100.0
            max_depth: 6
            num_leaves: 64
            num_threads: 8
            early_stopping_rounds: 50
            num_boost_round: 1000
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2021-06-01, 2024-06-30]
                valid: [2024-07-01, 2025-03-31]
                test:  [2025-04-01, 2026-04-24]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: false
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
